name: Build Android APK (TWA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'twa-project/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: استعادة ملف التوقيع (Keystore) من الأسرار
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > twa-project/android.keystore

      - name: بناء وتوقيع ملف APK
        working-directory: ./twa-project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android

      - name: رفع ملف APK كمخرجات
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: |
            twa-project/app-release-signed.apk
            twa-project/app-release-bundle.aab
