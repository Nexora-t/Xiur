name: 📱 بناء تطبيق APK من كود الويب

on:
  # ✅ دمج branches و tags في push واحدة
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]          # يُشغّل عند إنشاء tag يبدأ بـ v (مثل v1.0.0)
  # يسمح بتشغيله يدوياً من واجهة GitHub
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ضروري لرفع الملف إلى Releases

    steps:
      # 1. سحب كود المستودع
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      # 2. تحويل ملف HTML إلى تطبيق APK باستخدام PWA2APK
      - name: 🔨 بناء ملف APK
        uses: shamiko/action-pwa2apk@v1
        id: build_apk
        with:
          appName: 'منظم المهام اليومية'
          packageName: 'com.yourusername.taskorganizer'
          versionName: '1.0.0'
          versionCode: '1'
          source: './index.html'
          # icon: './icon.png'   # (اختياري) أضف هذا السطر إذا كان لديك أيقونة

      # 3. رفع ملف APK كـ Artifact مؤقت (للتحميل من تبويب Actions)
      - name: ⬆️ رفع APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: تطبيق-المهام-اليومية
          path: ${{ steps.build_apk.outputs.apk_path }}

      # 4. إذا كان هناك Tag، أنشئ Release وأرفق الـ APK
      - name: 🏷️ إنشاء إصدار وإرفاق APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
