name: Build APK from PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pwa2apk
        run: npm install -g pwa2apk

      - name: Build APK
        run: |
          npx pwa2apk https://studiounp.lovable.app/manifest.json \
            --package com.yourcompany.studiounp \
            --output ./app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: ./app.apk
