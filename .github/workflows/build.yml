name: Build APK (Manual SDK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تثبيت Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: تثبيت Android SDK عبر apt
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/lib/android-sdk/platform-tools:/usr/lib/android-sdk/tools/bin" >> $GITHUB_ENV

      - name: تثبيت منصة Android 34 وأدوات البناء
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" --verbose

      - name: سحب المشروع
        run: git clone https://github.com/xtools-at/Android-PWA-Wrapper.git

      - name: تحديث الإعدادات
        run: |
          # تحديث Gradle Wrapper
          sed -i 's/gradle-.*-bin.zip/gradle-7.2-bin.zip/g' Android-PWA-Wrapper/gradle/wrapper/gradle-wrapper.properties

          # تحديث build.gradle الرئيسي
          cat > Android-PWA-Wrapper/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # تحديث build.gradle الخاص بالتطبيق
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' Android-PWA-Wrapper/app/build.gradle
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' Android-PWA-Wrapper/app/build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' Android-PWA-Wrapper/app/build.gradle

          # تحديث رابط التطبيق
          sed -i 's|_WEBAPP_URL_|https://studiounp.lovable.app|g' Android-PWA-Wrapper/app/src/main/java/at/xtools/pwawrapper/Constants.java

      - name: منح صلاحيات التنفيذ لـ Gradle
        run: chmod +x Android-PWA-Wrapper/gradlew

      - name: تنظيف وبناء APK
        run: |
          cd Android-PWA-Wrapper
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: Android-PWA-Wrapper/app/build/outputs/apk/debug/*.apk
