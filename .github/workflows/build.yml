name: 📱 بناء تطبيق APK من كود الويب

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      # 1. تثبيت Java (مطلوب لأدوات Android)
      - name: ☕ تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. تثبيت Android SDK وأدوات البناء
      - name: 📦 تثبيت Android SDK
        uses: android-actions/setup-android@v3

      # 3. تثبيت Node.js و pwa2apk
      - name: 🟢 تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 تثبيت pwa2apk
        run: npm install -g pwa2apk

      # 4. بناء ملف APK باستخدام pwa2apk
      - name: 🔨 تحويل index.html إلى APK
        run: |
          pwa2apk --input ./index.html \
                  --output ./app.apk \
                  --name "منظم المهام اليومية" \
                  --package "com.yourusername.taskorganizer" \
                  --version "1.0.0" \
                  --versionCode 1

      # 5. رفع APK كـ Artifact للتحميل المؤقت
      - name: ⬆️ رفع APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: تطبيق-المهام-اليومية
          path: ./app.apk

      # 6. إنشاء Release مع APK (إذا كان هناك Tag)
      - name: 🏷️ إنشاء إصدار وإرفاق APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./app.apk
          generate_release_notes: true
          draft: false
          prerelease: false
