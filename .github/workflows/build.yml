name: 📱 بناء تطبيق APK باستخدام Cordova

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      # 1. تثبيت Java (مطلوب لأدوات Android)
      - name: ☕ تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. تثبيت Android SDK وأدوات البناء
      - name: 📦 تثبيت Android SDK
        uses: android-actions/setup-android@v3

      # 3. تثبيت Node.js و Cordova
      - name: 🟢 تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 تثبيت Cordova
        run: npm install -g cordova

      # 4. إنشاء مشروع Cordova وتهيئته
      - name: 🏗️ إنشاء مشروع Cordova
        run: |
          cordova create myApp com.yourusername.taskorganizer "منظم المهام اليومية"
          cd myApp
          # حذف الملفات الافتراضية واستبدالها بملفاتنا
          rm -rf www/*
          cp -r ../* www/  # نسخ كل الملفات من الجذر (بما فيها index.html)
          # إضافة منصة Android
          cordova platform add android
          # إضافة الإذن بالإنترنت (افتراضي موجود)
          # بناء التطبيق (نسخة release)
          cordova build android --release -- --keystore=../dummy.keystore --storePassword=password --alias=alias --keyPassword=password
          # لكن لا يوجد keystore حقيقي، لذلك سنستخدم debug build مؤقتاً
          # سنقوم ببناء debug بدلاً من release للتسهيل
          cordova build android --debug

      # 5. نقل ملف APK الناتج إلى مكان واضح
      - name: 📂 نقل APK إلى الجذر
        run: |
          cp myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk ./app.apk

      # 6. رفع APK كـ Artifact
      - name: ⬆️ رفع APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: تطبيق-المهام-اليومية
          path: ./app.apk

      # 7. إنشاء Release مع APK (إذا كان هناك Tag)
      - name: 🏷️ إنشاء إصدار وإرفاق APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./app.apk
          generate_release_notes: true
          draft: false
          prerelease: false
