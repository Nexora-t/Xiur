name: Build APK with Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize project from manifest
        run: |
          bubblewrap init --manifest https://studiounp.lovable.app/manifest.json \
            --directory ./android-app

      - name: Build APK
        run: |
          cd android-app
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-apk
          path: android-app/app/build/outputs/apk/release/*.apk
