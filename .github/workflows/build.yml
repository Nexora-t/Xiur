name: Build APK (Android Wrapper)

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # يمكنك تشغيله يدويًا من GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ضبط Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ضبط Android SDK
        uses: android-actions/setup-android@v3

      - name: سحب مشروع Android الجاهز
        run: git clone https://github.com/xtools-at/Android-PWA-Wrapper.git

      - name: تعديل رابط تطبيقك داخل المشروع
        run: |
          cd Android-PWA-Wrapper/app/src/main/java/at/xtools/pwawrapper
          sed -i 's|_WEBAPP_URL_|https://studiounp.lovable.app|g' Constants.java

      - name: منح صلاحيات التنفيذ لـ Gradle
        run: chmod +x Android-PWA-Wrapper/gradlew

      - name: بناء الـ APK (نسخة Debug)
        run: |
          cd Android-PWA-Wrapper
          ./gradlew assembleDebug --no-daemon

      - name: رفع ملف APK الناتج
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: Android-PWA-Wrapper/app/build/outputs/apk/debug/*.apk
