name: Build APK with Java 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تثبيت Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'  # تغيير الإصدار من 17 إلى 11

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3

      - name: سحب المشروع
        run: git clone https://github.com/xtools-at/Android-PWA-Wrapper.git

      - name: تحديث الإعدادات (بدون Python)
        run: |
          # تحديث Gradle Wrapper
          sed -i 's/gradle-.*-bin.zip/gradle-7.2-bin.zip/g' Android-PWA-Wrapper/gradle/wrapper/gradle-wrapper.properties
          # تحديث Constants.java
          sed -i 's|_WEBAPP_URL_|https://studiounp.lovable.app|g' Android-PWA-Wrapper/app/src/main/java/at/xtools/pwawrapper/Constants.java

      - name: منح صلاحيات التنفيذ
        run: chmod +x Android-PWA-Wrapper/gradlew

      - name: بناء APK
        run: |
          cd Android-PWA-Wrapper
          ./gradlew assembleDebug --no-daemon

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: Android-PWA-Wrapper/app/build/outputs/apk/debug/*.apk
