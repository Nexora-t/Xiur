name: Build APK using Python + Gradle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ضبط Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ضبط Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: سحب مشروع Android الجاهز
        run: git clone https://github.com/xtools-at/Android-PWA-Wrapper.git

      - name: استخدام Python لتعديل الملفات وتحديث الإصدارات
        run: |
          python3 << EOF
          import os
          import re

          # 1. تعديل رابط التطبيق
          constants_path = "Android-PWA-Wrapper/app/src/main/java/at/xtools/pwawrapper/Constants.java"
          with open(constants_path, 'r') as f:
              content = f.read()
          content = content.replace('_WEBAPP_URL_', 'https://studiounp.lovable.app')
          with open(constants_path, 'w') as f:
              f.write(content)
          print("✅ تم تحديث رابط التطبيق")

          # 2. تحديث Gradle Wrapper إلى إصدار حديث
          props_path = "Android-PWA-Wrapper/gradle/wrapper/gradle-wrapper.properties"
          with open(props_path, 'r') as f:
              content = f.read()
          content = content.replace('gradle-6.5-bin.zip', 'gradle-8.4-bin.zip')
          with open(props_path, 'w') as f:
              f.write(content)
          print("✅ تم تحديث Gradle Wrapper")

          # 3. تحديث build.gradle (تحديد SDK)
          build_path = "Android-PWA-Wrapper/app/build.gradle"
          with open(build_path, 'r') as f:
              content = f.read()
          content = re.sub(r'compileSdkVersion \d+', 'compileSdkVersion 34', content)
          content = re.sub(r'targetSdkVersion \d+', 'targetSdkVersion 34', content)
          with open(build_path, 'w') as f:
              f.write(content)
          print("✅ تم تحديث إصدارات SDK")
          EOF

      - name: منح صلاحيات التنفيذ لـ Gradle
        run: chmod +x Android-PWA-Wrapper/gradlew

      - name: تنظيف المشروع
        run: |
          cd Android-PWA-Wrapper
          ./gradlew clean --no-daemon

      - name: بناء الـ APK
        run: |
          cd Android-PWA-Wrapper
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: Android-PWA-Wrapper/app/build/outputs/apk/debug/*.apk
