name: Build APK (SDK with absolute path)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تثبيت Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: تنزيل Android Command Line Tools
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip -d cmdline-tools
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools/* android-sdk/cmdline-tools/
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: تثبيت منصة Android 34 وأدوات البناء
        run: |
          # تحديث PATH للجلسة الحالية
          export PATH="$HOME/android-sdk/cmdline-tools/bin:$HOME/android-sdk/platform-tools:$PATH"
          # إنشاء المجلدات المطلوبة
          mkdir -p $HOME/android-sdk
          # قبول التراخيص تلقائياً وتثبيت الحزم
          yes | sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: سحب مشروع Android-PWA-Wrapper
        run: git clone https://github.com/xtools-at/Android-PWA-Wrapper.git

      - name: تحديث الإعدادات
        run: |
          # تحديث Gradle Wrapper إلى 7.2
          sed -i 's/gradle-.*-bin.zip/gradle-7.2-bin.zip/g' Android-PWA-Wrapper/gradle/wrapper/gradle-wrapper.properties

          # استبدال build.gradle الرئيسي
          cat > Android-PWA-Wrapper/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # تحديث build.gradle الخاص بالتطبيق
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' Android-PWA-Wrapper/app/build.gradle
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' Android-PWA-Wrapper/app/build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' Android-PWA-Wrapper/app/build.gradle

          # إدراج رابط تطبيقك
          sed -i 's|_WEBAPP_URL_|https://studiounp.lovable.app|g' Android-PWA-Wrapper/app/src/main/java/at/xtools/pwawrapper/Constants.java

      - name: منح صلاحيات التنفيذ لـ Gradle
        run: chmod +x Android-PWA-Wrapper/gradlew

      - name: بناء APK
        run: |
          cd Android-PWA-Wrapper
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: Android-PWA-Wrapper/app/build/outputs/apk/debug/*.apk
