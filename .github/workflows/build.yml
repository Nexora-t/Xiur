name: Build Android APK with PWABuilder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder
        run: npm install -g @pwabuilder/pwabuilder

      - name: Build APK
        run: pwabuilder build https://studiounp.lovable.app --platform android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studiounp-app
          path: pwabuilder-output/android/*.apk
